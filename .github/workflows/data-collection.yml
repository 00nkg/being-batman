
name: Website Scraper

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python -u src/scraper.py
        timeout-minutes: 3

      - name: Check data.json
        run: |
          if [ ! -f data.json ]; then
            echo "ERROR: data.json not found!"
            exit 1
          fi

          python -m json.tool data.json > /dev/null
          echo "JSON file is valid."

      - name: Update JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No changes in data.json"
          else
            git commit -m "Update website data"
            git push
          fi
