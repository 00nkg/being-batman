name: Website Scraper

on:
  schedule:
    # हर 6 घंटे में चलेगा (क्योंकि Playwright से GitHub के फ्री मिनट्स जल्दी खत्म होते हैं)
    - cron: "0 */6 * * *" 

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    # टाइमआउट बढ़ाकर 30 मिनट कर दिया है
    timeout-minutes: 30 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Playwright के लिए ब्राउज़र इंस्टॉल करना ज़रूरी है
      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Run scraper
        run: python -u src/scraper.py
        # स्क्रिप्ट चलने का टाइमआउट 20 मिनट कर दिया है
        timeout-minutes: 20 

      # अब हम data.json की जगह api/latest.json चेक करेंगे
      - name: Check api/latest.json
        run: |
          if [ ! -f api/latest.json ]; then
            echo "ERROR: api/latest.json not found!"
            exit 1
          fi

          python -m json.tool api/latest.json > /dev/null
          echo "JSON file is valid."

      - name: Update JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # अब हम api/latest.json को अपडेट करेंगे
          git add api/latest.json

          if git diff --cached --quiet; then
            echo "No changes in api/latest.json"
          else
            git commit -m "Update website data"
            git push
          fi
